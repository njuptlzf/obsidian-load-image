name: Release
# Builds the plugin on a version tag and attaches the artifacts to a
# GitHub release, as required by the Obsidian community plugin submission.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  # Needed to sign the release assets with a build provenance attestation.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Obsidian matches the release tag against manifest.json's version
      # exactly, so a "v" prefix makes the submission fail with
      # "no GitHub release with that version has been published yet".
      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./manifest.json').version")
          echo "tag=$TAG manifest=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' must equal manifest.json version '$VERSION' (no 'v' prefix)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # typecheck + 68 unit tests + production build + runtime smoke test
      - run: npm run verify

      # Cryptographically prove that the released assets were built from this
      # repository — the Obsidian plugin review asks for it.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Only the files Obsidian downloads from a release. versions.json
          # stays in the repository (Obsidian reads it from there), attaching
          # it to the release makes the plugin review report an unsupported
          # extra file.
          files: |
            main.js
            manifest.json
            styles.css
