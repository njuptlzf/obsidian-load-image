name: Release
# Builds the plugin on a version tag and attaches the artifacts to a
# GitHub release, as required by the Obsidian community plugin submission.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # typecheck + 68 unit tests + production build + runtime smoke test
      - run: npm run verify

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
            versions.json
